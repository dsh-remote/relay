name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的重复推送取消旧运行，节省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # 工具链固定 22：pnpm 11.7 要求 Node ≥ 22.13（它 import `node:sqlite`）。
      # 这里原先直接用矩阵版本，于是 node 20 那条腿连 setup-node 的 pnpm 缓存步骤都过不去。
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      # lockfile 已提交（协议包 `dsh-remote-wire@1.0.0` 上了 npm 之后生成的），所以冻结安装。
      # 协议升版后要重新 `pnpm install` 并提交新的 pnpm-lock.yaml，否则这里会红。
      - name: Install
        run: pnpm install --frozen-lockfile

      # 静态检查跑一次就够，两条腿重复跑没有额外信息。
      - name: Type-check
        if: matrix.node == '22'
        run: pnpm typecheck

      - name: Format check
        if: matrix.node == '22'
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # engines 写的是 >=20，那就得真在 20 上把测试跑一遍。测试是普通 JS（import ../dist/src/*.js），
      # 不经 pnpm，所以这里可以把 node 切成矩阵版本。
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # 用 find 显式列文件，而不是把 glob 交给 node：`--test` 的位置参数语义在版本之间变过——
      # node 20 把它当字面路径（`tests/*.test.mjs` 直接 "Could not find"），node 22 才当 glob。
      # 文件数还必须先断言非零，否则目录一改名就变成"0 个测试全绿"。
      - name: Run tests on node ${{ matrix.node }}
        run: |
          set -e
          n="$(find tests -name '*.test.mjs' | wc -l)"
          echo "测试文件数：$n"
          [ "$n" -gt 0 ] || { echo "tests 下没找到 *.test.mjs（目录或命名变了？）"; exit 1; }
          find tests -name '*.test.mjs' -print0 | xargs -0 node --test

  # 部署形态的机械防线：在**最低支持版本**上把单文件产物拷进一个空目录，真起一次，
  # 断言 /healthz 的 version 等于包版本、SIGTERM 退出码为 0。这条独立于测试套件，
  # 因为它是"生产只有一个文件"这句话的可执行版本。
  relay-smoke:
    name: relay smoke (single-file artifact, node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # 装与打包用 22（pnpm 11.7 的下限），**跑产物**才切到最低支持版本 20——
      # 这条 job 要证明的是"一个文件在 node 20 上能跑"，不是"pnpm 能在 20 上装"。
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      # 同 test job：lockfile 已提交，冻结安装。
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the single-file artifact
        run: pnpm build

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run it from an empty directory
        run: |
          set -e
          # 先把包版本读进环境变量，再 cd 走——否则会去读空目录里并不存在的 package.json。
          WANT_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          export WANT_VERSION

          mkdir -p /tmp/drc-smoke
          cp dist/bundle/main.js /tmp/drc-smoke/relay.mjs
          cd /tmp/drc-smoke
          DRC_HOST_TOKEN=smoke-token-0123456789abcdef DRC_PORT=0 \
            node relay.mjs > smoke.log 2>&1 &
          pid=$!
          # 等它打印出真实端口（DRC_PORT=0 时由系统分配）。
          for _ in $(seq 1 50); do
            grep -q 'relay listening' smoke.log && break
            sleep 0.2
          done
          port="$(sed -n 's/.*"msg":"relay listening","port":\([0-9]*\).*/\1/p' smoke.log | head -1)"
          test -n "$port" || { echo "没有从启动日志里读到端口"; cat smoke.log; exit 1; }

          got="$(curl -s "http://127.0.0.1:$port/healthz" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
          echo "healthz version=$got  package version=$WANT_VERSION"
          [ "$got" = "$WANT_VERSION" ] || { echo "version 不匹配（出现 0.0.0 说明 define 没进去）"; exit 1; }

          kill -TERM "$pid"
          code=0
          wait "$pid" || code=$?
          echo "exit code=$code"
          [ "$code" = "0" ] || exit 1
          cat smoke.log
